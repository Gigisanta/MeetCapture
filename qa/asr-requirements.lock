# QA environment: macOS arm64, CPython 3.11-3.14 (including 3.14 free-threaded).
# Install with: python -m pip install --require-hashes -r qa/asr-requirements.lock
# PyPI release JSON is the source of versions, Requires-Dist and wheel SHA-256s:
# https://pypi.org/pypi/jiwer/4.0.0/json
# https://pypi.org/pypi/click/8.1.8/json
# https://pypi.org/pypi/rapidfuzz/3.14.6/json
# JiWER requires click>=8.1.8 and rapidfuzz>=3.9.7. RapidFuzz has no runtime
# dependencies without the optional 'all' extra. Click's colorama dependency is
